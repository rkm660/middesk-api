[project]
name = "middesk-api"
version = "0.1.0"
description = "Simple company/address API backed by SQLite"
readme = "README.md"
authors = [
    { email = "rahulmatta01@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
